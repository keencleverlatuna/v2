name: v2
description: A Flutter music player and streaming application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^16.3.0
  liquid_glass_widgets: ^0.24.4
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  audioplayers: ^6.8.1
  audioplayers_android_exo: ^0.1.4
  audio_metadata_reader: ^1.7.1
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  path_provider: ^2.1.6
  file_picker: 12.0.0-beta.7
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
